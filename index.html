<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metages Yibeltal - Developer Platform & Profile Statistics</title>
  
  <!-- Core & Global Stylesheets (Must be at the top) -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/tables.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
  
  <!-- Feature Stylesheets -->
  <link rel="stylesheet" href="css/features/commandPalette.css" />
  <link rel="stylesheet" href="css/features/heatmap.css" />
  <link rel="stylesheet" href="css/features/terminal.css" />
  <link rel="stylesheet" href="css/features/timeline.css" />
  <link rel="stylesheet" href="css/features/playground.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: var(--bg-primary); color: var(--text-primary);">
  
  <!-- Global Application Header -->
  <div id="app-header-root"></div>

  <!-- Main Content Area -->
  <main class="main-content" style="flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem;">
    
    <!-- GitHub Analytics Dashboard View -->
    <div id="main-content-view"></div>

    <!-- Non-GitHub Feature Widgets Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
      <div id="playground-container-root"></div>
      <div id="skills-container-root"></div>
    </div>

    <!-- Heatmap & Terminal Grid -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
      <div id="heatmap-container-root"></div>
      <div id="terminal-container-root"></div>
    </div>

    <!-- Experience Timeline -->
    <div id="timeline-container-root"></div>

  </main>

  <!-- Global Application Footer -->
  <div id="app-footer-root"></div>

  <!-- Application Bootstrap Script -->
  <script type="module">
    import { initTheme } from './js/core/theme.js';
    import { renderHeader } from './js/components/Header.js';
    import { renderFooter } from './js/components/Footer.js';
    import { renderDashboard } from './js/views/DashboardView.js';
    import { renderCodePlayground } from './js/features/playground/codePlayground.js';
    import { renderSkillMatrix } from './js/features/skills/skillMatrix.js';
    import { renderContributionHeatmap } from './js/features/heatmap/contributionMatrix.js';
    import { renderTerminalSimulator } from './js/features/terminal/terminalSimulator.js';
    import { renderExperienceTimeline } from './js/features/timeline/experienceTimeline.js';
    import { fetchLiveGitHubProfile } from './js/services/githubApi.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      
      const headerRoot = document.getElementById('app-header-root');
      if (headerRoot) renderHeader(headerRoot);

      // Centralized UI refresh function for any entered username
      window.refreshAppUI = async (username) => {
        const profileData = await fetchLiveGitHubProfile(username);

        // 1. Update Footer dynamically based on active user
        const footerRoot = document.getElementById('app-footer-root');
        if (footerRoot) renderFooter(footerRoot, profileData.profile);

        // 2. Render Dashboard view with active user stats
        const mainView = document.getElementById('main-content-view');
        if (mainView) await renderDashboard(mainView, username);

        // 3. Render Terminal simulator with new user context
        const terminalRoot = document.getElementById('terminal-container-root');
        if (terminalRoot) renderTerminalSimulator(terminalRoot, username);

        // 4. Render Skill Matrix with dynamic language stats
        const skillsRoot = document.getElementById('skills-container-root');
        if (skillsRoot) renderSkillMatrix(skillsRoot, profileData.languages);
      };

      // Initially load with `null` so it prompts the user to enter a username
      const mainView = document.getElementById('main-content-view');
      if (mainView) {
        await renderDashboard(mainView, null);
      }

      const playgroundRoot = document.getElementById('playground-container-root');
      if (playgroundRoot) renderCodePlayground(playgroundRoot);

      const heatmapRoot = document.getElementById('heatmap-container-root');
      if (heatmapRoot) renderContributionHeatmap(heatmapRoot);

      const terminalRoot = document.getElementById('terminal-container-root');
      if (terminalRoot) renderTerminalSimulator(terminalRoot, 'Yetemare-Yibeltal');

      try {
        const res = await fetch('assets/data/experienceData.json');
        const data = await res.json();
        const timelineRoot = document.getElementById('timeline-container-root');
        if (timelineRoot && data.milestones) {
          renderExperienceTimeline(timelineRoot, data.milestones);
        }
      } catch (e) {
        console.warn('Timeline load error', e);
      }
    });
  </script>
</body>
</html>
