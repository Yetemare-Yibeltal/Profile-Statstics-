<script type="module">
    import { initTheme } from './js/core/theme.js';
    import { renderHeader } from './js/components/Header.js';
    import { renderFooter } from './js/components/Footer.js';
    import { renderDashboard } from './js/views/DashboardView.js';
    import { renderCodePlayground } from './js/features/playground/codePlayground.js';
    import { renderSkillMatrix } from './js/features/skills/skillMatrix.js';
    import { renderContributionHeatmap } from './js/features/heatmap/contributionMatrix.js';
    import { renderTerminalSimulator } from './js/features/terminal/terminalSimulator.js';
    import { renderExperienceTimeline } from './js/features/timeline/experienceTimeline.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      renderHeader(document.getElementById('app-header-root'));
      renderFooter(document.getElementById('app-footer-root'));

      const initialUser = 'Yetemare-Yibeltal';

      // 1. Mount the GitHub Analytics Dashboard view with default user
      await renderDashboard(document.getElementById('main-content-view'), initialUser);

      // 2. Mount expanded features
      renderCodePlayground(document.getElementById('playground-container-root'));
      renderSkillMatrix(document.getElementById('skills-container-root'));
      renderContributionHeatmap(document.getElementById('heatmap-container-root'));
      renderTerminalSimulator(document.getElementById('terminal-container-root'), initialUser);

      // 3. Load experience timeline data
      try {
        const res = await fetch('assets/data/experienceData.json');
        const data = await res.json();
        renderExperienceTimeline(document.getElementById('timeline-container-root'), data.milestones);
      } catch (e) {
        console.warn('Timeline load error', e);
      }
    });
  </script>
