<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Granular Analytics - Profile Statistics</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/tables.css" />
  <link rel="stylesheet" href="css/views/analytics.css" />
</head>
<body>
  <div id="app-header-root"></div>
  <main class="main-content" id="view-root"></main>

  <script type="module">
    import { initTheme } from './js/core/theme.js';
    import { renderHeader } from './js/components/Header.js';
    import { renderAnalytics } from './js/views/AnalyticsView.js';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      renderHeader(document.getElementById('app-header-root'));
      renderAnalytics(document.getElementById('view-root'));
    });
  </script>
</body>
</html>
