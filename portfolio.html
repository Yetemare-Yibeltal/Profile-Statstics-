<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio - DevPlatform</title>
  
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: var(--bg-primary); color: var(--text-primary);">
  <div id="app-header-root"></div>
  
  <main class="main-content" style="flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 2rem 1.5rem;">
    <div id="portfolio-container">
      <div style="text-align: center; padding: 4rem 1.5rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); max-width: 600px; margin: 2rem auto;">
        <h2 style="color: var(--text-primary); margin-bottom: 0.75rem;">No GitHub User Selected</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Please enter a GitHub username to view live profile analytics.</p>
        <form id="page-search-form" style="display: flex; gap: 0.5rem; max-width: 400px; margin: 0 auto;">
          <input type="text" id="page-username-input" placeholder="Enter GitHub username..." required style="flex: 1; padding: 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);" />
          <button type="submit" style="background: var(--accent-blue); color: #0f172a; border: none; padding: 0.6rem 1rem; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;">Search</button>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer-root"></div>

  <script type="module">
    import { initTheme } from './js/core/theme.js';
    import { renderHeader } from './js/components/Header.js';
    import { renderFooter } from './js/components/Footer.js';
    import { fetchLiveGitHubProfile } from './js/services/githubApi.js';
    import { createStatCard } from './js/components/StatCard.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      renderHeader(document.getElementById('app-header-root'));

      const urlParams = new URLSearchParams(window.location.search);
      const username = urlParams.get('user') || localStorage.getItem('active_github_user');

      const container = document.getElementById('portfolio-container');

      if (!username) {
        renderFooter(document.getElementById('app-footer-root'), {});
        document.getElementById('page-search-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const val = document.getElementById('page-username-input').value.trim();
          if (val) {
            localStorage.setItem('active_github_user', val);
            window.location.href = `portfolio.html?user=${val}`;
          }
        });
        return;
      }

      localStorage.setItem('active_github_user', username);
      const data = await fetchLiveGitHubProfile(username);
      renderFooter(document.getElementById('app-footer-root'), data.profile);

      container.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 2rem;">
          <section style="display: flex; gap: 2rem; align-items: center; background: var(--bg-card); padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
            <img src="${data.profile.avatar}" alt="${data.profile.name}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue);" />
            <div>
              <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem; color: var(--text-primary);">${data.profile.name}</h1>
              <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem;">${data.profile.bio}</p>
              <a href="${data.profile.profileUrl}" target="_blank" style="display: inline-block; background: var(--accent-blue); color: #0f172a; padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-weight: 600; text-decoration: none; font-size: 0.85rem;">🔗 View GitHub Profile</a>
            </div>
          </section>
          <div class="grid-4" id="portfolio-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem;"></div>
        </div>
      `;

      const statsGrid = document.getElementById('portfolio-stats');
      statsGrid.appendChild(createStatCard('Public Repositories', data.profile.publicRepos, 0, '📂'));
      statsGrid.appendChild(createStatCard('Total Stars', data.profile.totalStars, 0, '⭐'));
      statsGrid.appendChild(createStatCard('Followers', data.profile.followers, 0, '👥'));
      statsGrid.appendChild(createStatCard('Following', data.profile.following, 0, '🔗'));
    });
  </script>
</body>
</html>
