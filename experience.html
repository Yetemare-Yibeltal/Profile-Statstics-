<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience Timeline - Metages Yibeltal</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components/navbar.css" />
  <link rel="stylesheet" href="css/components/footer.css" />
  <link rel="stylesheet" href="css/features/timeline.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <div id="app-header-root"></div>
  
  <main class="main-content" style="flex: 1; max-width: 900px; margin: 0 auto; width: 100%;">
    <div id="timeline-root">
      <p style="color: var(--text-secondary);">Loading experience timeline...</p>
    </div>
  </main>

  <div id="app-footer-root"></div>

  <script type="module">
    import { initTheme } from './js/core/theme.js';
    import { renderHeader } from './js/components/Header.js';
    import { renderFooter } from './js/components/Footer.js';
    import { renderExperienceTimeline } from './js/features/timeline/experienceTimeline.js';

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      renderHeader(document.getElementById('app-header-root'));
      renderFooter(document.getElementById('app-footer-root'));

      try {
        const response = await fetch('assets/data/experienceData.json');
        const data = await response.json();
        renderExperienceTimeline(document.getElementById('timeline-root'), data.milestones);
      } catch (e) {
        console.error('Failed to load experience milestones', e);
      }
    });
  </script>
</body>
</html>
